    <script>
      (function () {
        try {
          var ownDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          var protoDesc =
            !ownDesc && typeof Window !== 'undefined' && Window.prototype
              ? Object.getOwnPropertyDescriptor(Window.prototype, 'fetch')
              : null;
          var targetDesc = ownDesc || protoDesc;

          if (
            targetDesc &&
            targetDesc.get &&
            !targetDesc.set &&
            (!ownDesc || ownDesc.configurable)
          ) {
            var currentFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: targetDesc.enumerable !== false,
              get: function () {
                return currentFetch;
              },
              set: function (nextFetch) {
                if (typeof nextFetch === 'function') {
                  currentFetch = nextFetch;
                }
              },
            });
          }
        } catch (_err) {}

        window.addEventListener(
          'error',
          function (event) {
            if (
              event &&
              typeof event.filename === 'string' &&
              event.filename.indexOf('chrome-extension://') === 0 &&
              typeof event.message === 'string' &&
              event.message.indexOf('Cannot set property fetch') !== -1
            ) {
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
